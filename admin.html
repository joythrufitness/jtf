<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<link rel="icon" href="images/favicon.png" type="image/png"/>
<title>JTF Site Editor — Moved</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet"/>
<style>
:root{--orange:#e93e3a;--black:#111;--text:#222;--mid:#555;--border:#e0e0e0;--gray:#f7f7f7;
  --fh:'Montserrat',sans-serif;--fb:'Open Sans',sans-serif;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fb);color:var(--text);background:var(--gray);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:44px;max-width:480px;text-align:center}
.label{font-family:var(--fh);font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--orange);margin-bottom:14px}
h1{font-family:var(--fh);font-size:24px;font-weight:800;color:var(--text);margin-bottom:16px}
p{font-size:15px;color:var(--mid);line-height:1.7;margin-bottom:20px}
a.btn{display:inline-block;font-family:var(--fh);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:14px 28px;border-radius:4px;background:var(--orange);color:#fff;text-decoration:none;margin:6px}
a.btn:hover{background:#c42e2a}
a.link{color:var(--orange);font-size:14px}
</style>
</head>
<body>
  <div class="card">
    <div class="label">Joy Thru Fitness</div>
    <h1>The Editor Has Moved</h1>
    <p>This old editor page is no longer used. Website content is now edited through <strong>Pages CMS</strong> — no more downloading files or uploading to GitHub by hand. Changes you save there go live automatically.</p>
    <a class="btn" href="https://app.pagescms.org" target="_blank" rel="noopener">Open Pages CMS →</a>
    <p style="margin-top:24px"><a class="link" href="sop.html">See the step-by-step guide</a></p>
  </div>
</body>
</html>
