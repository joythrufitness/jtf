media:
  - name: images
    label: Images
    input: images
    output: /images
    categories: [image]
    rename: false
  - name: docs
    label: Documents
    input: docs
    output: /docs
    categories: [document]
    extensions: [pdf]
    rename: false

# Each site section is its own file, so the editor shows a flat list
# (Hero, Pricing, Trainers, ...) instead of one long nested document.
content:

  - name: hero
    label: Hero (Top of Page)
    type: file
    path: content/hero.json
    format: json
    fields:
      - name: headline
        label: Headline
        type: string
      - name: image
        label: Background image
        type: image
        options:
          media: images

  - name: mission
    label: Mission Banner
    type: file
    path: content/mission.json
    format: json
    fields:
      - name: label
        label: Small label
        type: string
      - name: text
        label: Mission statement
        type: text

  - name: personal-training
    label: Personal Training
    type: file
    path: content/personal-training.json
    format: json
    fields:
      - name: label
        label: Small label
        type: string
      - name: heading
        label: Heading
        type: string
      - name: intro
        label: Intro paragraphs
        type: text
        list: true
      - name: listLabel
        label: List intro line
        type: string
      - name: items
        label: Bullet points
        type: string
        list: true
      - name: btn
        label: Button text
        type: string
      - name: btnHref
        label: Button link
        type: string
      - name: image
        label: Photo
        type: image
        options:
          media: images

  - name: time-4-u
    label: "Time 4 U"
    type: file
    path: content/time-4-u.json
    format: json
    fields:
      - name: label
        label: Small label
        type: string
      - name: heading
        label: Heading
        type: string
      - name: intro
        label: Intro paragraph
        type: text
      - name: listLabel
        label: List intro line
        type: string
      - name: items
        label: Bullet points
        type: string
        list: true
      - name: note
        label: Note (italic line)
        type: text
      - name: cta
        label: Call-to-action line
        type: string
      - name: email
        label: Contact email shown here
        type: string
      - name: image
        label: Photo
        type: image
        options:
          media: images

  - name: group-classes
    label: Group Classes
    type: file
    path: content/group-classes.json
    format: json
    fields:
      - name: label
        label: Small label
        type: string
      - name: heading
        label: Heading
        type: string
      - name: priceBadge
        label: Price badge (e.g. $20)
        type: string
      - name: scheduleUrl
        label: "\"See Schedules\" button link"
        type: string
      - name: image
        label: Photo
        type: image
        options:
          media: images
      - name: specialMsg
        label: Highlighted note (optional)
        type: string
        required: false
      - name: list
        label: Classes
        type: object
        list:
          collapsible:
            summary: "{fields.name}"
        fields:
          - name: name
            label: Class name
            type: string
          - name: desc
            label: Description
            type: text

  - name: payment
    label: Payment Info
    type: file
    path: content/payment.json
    format: json
    fields:
      - name: venmo
        label: Venmo handle
        type: string
      - name: zelle
        label: Zelle number
        type: string

  - name: pricing
    label: Pricing
    type: file
    path: content/pricing.json
    format: json
    fields:
      - name: consultNote
        label: Consult note (shown above Individual tab)
        type: string

      - name: individual
        label: "Individual — pricing tiers"
        type: object
        list:
          collapsible:
            summary: "{fields.freq}"
        fields:
          - name: freq
            label: Frequency (e.g. "3x per week")
            type: string
          - name: sessions
            label: Sessions per month
            type: number
          - name: badge
            label: "Badge (e.g. \"Best Value\") — leave blank for none"
            type: string
            required: false
          - name: save
            label: "Savings note — leave blank for none"
            type: string
            required: false
          - name: rows
            label: Duration / price rows
            type: object
            list: true
            fields:
              - name: l
                label: Duration (e.g. "60 min")
                type: string
              - name: v
                label: Price per session
                type: string
              - name: mo
                label: Monthly total (optional)
                type: string
                required: false

      - name: specials
        label: Specials tab
        type: object
        fields:
          - name: title
            label: Title
            type: string
          - name: note
            label: Note
            type: string
          - name: deals
            label: Deals
            type: object
            list: true
            fields:
              - name: freq
                label: Description (e.g. "1x per week · 12 sessions")
                type: string
              - name: price
                label: Price
                type: string

      - name: team
        label: Team tab
        type: object
        fields:
          - name: title
            label: Title
            type: string
          - name: note
            label: Note
            type: string
          - name: groups
            label: Pricing groups
            type: object
            list:
              collapsible:
                summary: "{fields.freq}"
            fields:
              - name: freq
                label: Frequency
                type: string
              - name: sessions
                label: Sessions per month
                type: number
              - name: rows
                label: Duration / price rows
                type: object
                list: true
                fields:
                  - name: l
                    label: Duration
                    type: string
                  - name: v
                    label: Monthly price
                    type: string

      - name: triathlon
        label: Triathlon tab
        type: object
        fields:
          - name: title
            label: Title
            type: string
          - name: intro
            label: Intro paragraph
            type: text
            required: false
          - name: subintro
            label: Second intro line (optional)
            type: text
            required: false
          - name: tiers
            label: Coaching plans (shown left to right)
            type: object
            list:
              collapsible:
                summary: "{fields.label} — from {fields.price}"
            fields:
              - name: label
                label: Plan name (e.g. "Performance Coaching")
                type: string
              - name: badge
                label: "Badge (e.g. \"Most Popular\") — leave blank for none"
                type: string
                required: false
              - name: hi
                label: Highlight this plan with an orange border?
                type: boolean
              - name: elite
                label: Premium gold styling (for the top plan)?
                type: boolean
              - name: price
                label: "\"Starting at\" price — the big number (e.g. \"$279\")"
                type: string
              - name: period
                label: Text under the big price (e.g. "per month")
                type: string
              - name: terms
                label: "Commitment prices — the lowest one is automatically marked \"Best rate\""
                type: object
                list: true
                fields:
                  - name: l
                    label: Commitment length (e.g. "12 Months")
                    type: string
                  - name: v
                    label: Monthly price (e.g. "$279/mo")
                    type: string
              - name: desc
                label: Short description (1–2 sentences)
                type: text
                required: false
              - name: feats
                label: "Included features — the first 6 show; the rest appear under \"See all\""
                type: string
                list: true
              - name: bestFor
                label: "\"Best for\" text (shown at the bottom of the card)"
                type: text
                required: false
          - name: footnote
            label: Note shown under the plans (optional)
            type: text
            required: false
          - name: addons
            label: In-person add-ons box (below the plans)
            type: object
            fields:
              - name: eyebrow
                label: Small label (e.g. "Want hands-on coaching?")
                type: string
                required: false
              - name: title
                label: "Heading — leave blank to hide the whole box"
                type: string
                required: false
              - name: intro
                label: Intro text
                type: text
                required: false
              - name: sessions
                label: Sessions & prices
                type: object
                list: true
                fields:
                  - name: l
                    label: Session (e.g. "60-Minute Technique Session")
                    type: string
                  - name: v
                    label: Price (e.g. "$105")
                    type: string
                  - name: note
                    label: Small note (e.g. "for active coaching clients")
                    type: string
                    required: false
              - name: focusLabel
                label: List heading (e.g. "Sessions may focus on:")
                type: string
                required: false
              - name: focus
                label: Focus areas
                type: string
                list: true
              - name: note
                label: Closing note (optional)
                type: text
                required: false

      - name: sbr
        label: "Swim / Bike / Run tab"
        type: object
        fields:
          - name: title
            label: Title
            type: string
          - name: note
            label: Note (optional)
            type: string
            required: false
          - name: groups
            label: Pricing groups
            type: object
            list:
              collapsible:
                summary: "{fields.freq}"
            fields:
              - name: freq
                label: Frequency
                type: string
              - name: sessions
                label: Sessions per month
                type: number
              - name: rows
                label: Duration / price rows
                type: object
                list: true
                fields:
                  - name: l
                    label: Duration
                    type: string
                  - name: v
                    label: Price per session
                    type: string
                  - name: mo
                    label: Monthly total (optional)
                    type: string
                    required: false
          - name: extras
            label: Triathlon-specific sessions (price list under the cards)
            type: object
            fields:
              - name: title
                label: "Heading — leave blank to hide the whole list"
                type: string
                required: false
              - name: note
                label: Note under the heading (optional)
                type: text
                required: false
              - name: items
                label: Sessions
                type: object
                list:
                  collapsible:
                    summary: "{fields.name} — {fields.price}"
                fields:
                  - name: name
                    label: Session name (e.g. "Swim Stroke Analysis")
                    type: string
                  - name: dur
                    label: Length (e.g. "60 min")
                    type: string
                  - name: price
                    label: Price (e.g. "$95")
                    type: string

  - name: about
    label: About
    type: file
    path: content/about.json
    format: json
    fields:
      - name: label
        label: Small label
        type: string
      - name: heading
        label: Heading
        type: string
      - name: paragraphs
        label: Paragraphs
        type: text
        list: true
      - name: btn
        label: Button text
        type: string
      - name: btnHref
        label: Button link
        type: string
      - name: image
        label: Photo
        type: image
        options:
          media: images

  - name: trainers
    label: Trainers
    type: file
    path: content/trainers.json
    format: json
    fields:
      - name: label
        label: Small label
        type: string
      - name: heading
        label: Heading
        type: string
      - name: people
        label: Trainers
        type: object
        list:
          collapsible:
            summary: "{fields.name}"
        fields:
          - name: name
            label: Name
            type: string
          - name: role
            label: Role / title
            type: string
          - name: photo
            label: Headshot
            type: image
            options:
              media: images
          - name: bio
            label: Bio
            type: text
          - name: sport
            label: Favorite sport
            type: string
          - name: interests
            label: Interests
            type: text
          - name: philosophy
            label: Training philosophy
            type: text
          - name: funfacts
            label: Fun facts
            type: text
          - name: certs
            label: Certifications
            type: string
            list: true

  - name: testimonials
    label: Testimonials
    type: file
    path: content/testimonials.json
    format: json
    fields:
      - name: label
        label: Small label
        type: string
      - name: heading
        label: Heading
        type: string
      - name: items
        label: Testimonials
        type: object
        list:
          collapsible:
            summary: "{fields.a}"
        fields:
          - name: q
            label: Quote
            type: text
          - name: a
            label: Attribution (client name)
            type: string
            required: false

  - name: contact
    label: Contact
    type: file
    path: content/contact.json
    format: json
    fields:
      - name: label
        label: Small label
        type: string
      - name: heading
        label: Heading
        type: string
      - name: phone
        label: Phone number
        type: string
      - name: email
        label: Email address
        type: string
      - name: web3formsKey
        label: "Web3Forms access key (do not change unless told to)"
        type: string
      - name: packages
        label: "Package options (contact form dropdown)"
        type: string
        list: true

  - name: resources
    label: Resources & Downloads
    type: file
    path: content/resources.json
    format: json
    fields:
      - name: label
        label: Small label
        type: string
      - name: heading
        label: Heading
        type: string
      - name: items
        label: Documents
        type: object
        list:
          collapsible:
            summary: "{fields.title}"
        fields:
          - name: title
            label: Title
            type: string
          - name: desc
            label: Description (optional)
            type: string
            required: false
          - name: file
            label: PDF file
            type: file
            options:
              media: docs

  - name: brand
    label: Brand Assets (logos — rarely changed)
    type: file
    path: content/brand.json
    format: json
    fields:
      - name: logoNav
        label: Header logo
        type: image
        options:
          media: images
      - name: logoFoot
        label: Footer logo (white version)
        type: image
        options:
          media: images
      - name: venmo
        label: "Venmo logo URL (external — leave as is)"
        type: string
      - name: zelle
        label: "Zelle logo URL (external — leave as is)"
        type: string
